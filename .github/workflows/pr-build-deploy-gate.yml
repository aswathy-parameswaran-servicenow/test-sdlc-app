name: PR build, deploy & gate checks

# Every trigger builds, then directly installs to `dev` and runs the ATF
# gate suite there -- this also keeps dev in sync with the code being
# tested/shipped, which the promotion step below depends on.
#
# On a merge to main (push), or a workflow_dispatch explicitly targeting
# `staging`, that dev install is followed by a promotion: publish the
# app from dev to the Application Repository (`now-sdk cicd publish`),
# then install that published version onto staging from the repository
# (`now-sdk cicd install`) and run the ATF suite there
# (`now-sdk cicd testsuite run`). A push event can't block the merge that
# already happened, so this reports post-merge/promotion health rather
# than gating anything.
#
# Direct `now-sdk install` only ever targets dev. staging (standing in for
# a real production instance here) always installs from the Application
# Repository via `now-sdk cicd`, matching the SDK's own guidance that
# direct SDK install is for the development instance only -- see
# `npx @servicenow/sdk explain sdlc-guide` and docs/ci-setup.md.
#
# Each target instance is its own GitHub Environment (dev, staging)
# holding that instance's SN_SDK_INSTANCE_URL variable and OAuth secrets.
# ATF_TEST_SUITE_ID is a plain repo variable -- it's generated by Now.ID at
# build time and is identical on every instance the app is installed to,
# so it doesn't need to be duplicated per environment.
#
# Both environments here are non-prod test-tier instances -- see
# docs/ci-setup.md before pointing any of this at anything
# business-critical; CI installs should never go straight to a real
# production instance.
#
# IMPORTANT: Application Repository versions are immutable -- publishing a
# version that already exists fails. Bump `version` in package.json (and
# tag the commit to match) before merging any change meant to promote to
# staging.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Promote to staging after the dev install? (dev always runs)'
        type: choice
        options:
          - dev
          - staging
        default: dev

# Every run touches dev, and a promoting run also touches staging -- keep
# a single group so no two runs of this workflow can race each other on
# either shared instance, regardless of which path they take.
concurrency:
  group: now-sdk-instance-install
  cancel-in-progress: false

jobs:
  build:
    name: Build (frozen keys)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # Fails if `now-sdk build` would change src/fluent/generated/keys.ts --
      # i.e. someone added/changed a Now.ID without committing the regenerated
      # keys file. See: npx @servicenow/sdk explain ci-integration
      - name: Build (validate keys.ts is up to date)
        run: npm run build:ci

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/
          retention-days: 1

  # Skipped for PRs from forks: GitHub does not expose secrets to
  # pull_request-triggered runs from a fork, so auth to the instance would
  # fail anyway. Maintainers should re-run this job manually via
  # workflow_dispatch after reviewing a fork PR, before merging. Manual
  # (workflow_dispatch) and push (post-merge) runs always proceed, since
  # neither is tied to a fork PR.
  #
  # Always targets dev directly -- this both gates PRs and keeps dev
  # current for the promotion jobs below to publish from.
  install-dev:
    name: Install to dev & run ATF gate
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: dist/

      # Non-interactive CI auth: see
      # npx @servicenow/sdk explain ci-integration
      - name: Install app on dev
        env:
          SN_SDK_NODE_ENV: SN_SDK_CI_INSTALL
          SN_SDK_AUTH_TYPE: oauth
          SN_SDK_INSTANCE_URL: ${{ vars.SN_SDK_INSTANCE_URL }}
          SN_SDK_OAUTH_CLIENT_ID: ${{ secrets.SN_SDK_OAUTH_CLIENT_ID }}
          SN_SDK_OAUTH_CLIENT_SECRET: ${{ secrets.SN_SDK_OAUTH_CLIENT_SECRET }}
        run: npm run deploy

      - name: Run ATF gate suite
        env:
          SN_SDK_INSTANCE_URL: ${{ vars.SN_SDK_INSTANCE_URL }}
          SN_SDK_OAUTH_CLIENT_ID: ${{ secrets.SN_SDK_OAUTH_CLIENT_ID }}
          SN_SDK_OAUTH_CLIENT_SECRET: ${{ secrets.SN_SDK_OAUTH_CLIENT_SECRET }}
          ATF_TEST_SUITE_ID: ${{ vars.ATF_TEST_SUITE_ID }}
        run: node tools/run-atf-suite.mjs

  # Promotion only -- runs on merge to main, or a manual dispatch that
  # explicitly chose staging. Publishes whatever is now installed on dev
  # (just confirmed healthy by install-dev) into the Application
  # Repository as an immutable, versioned artifact.
  publish-to-app-repo:
    name: Publish to Application Repository (from dev)
    needs: install-dev
    runs-on: ubuntu-latest
    environment: dev
    if: inputs.target_environment == 'staging' || github.event_name == 'push'
    outputs:
      app-version: ${{ steps.publish.outputs.app-version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Publish to Application Repository
        id: publish
        env:
          SN_SDK_NODE_ENV: SN_SDK_CI_INSTALL
          SN_SDK_AUTH_TYPE: oauth
          SN_SDK_INSTANCE_URL: ${{ vars.SN_SDK_INSTANCE_URL }}
          SN_SDK_OAUTH_CLIENT_ID: ${{ secrets.SN_SDK_OAUTH_CLIENT_ID }}
          SN_SDK_OAUTH_CLIENT_SECRET: ${{ secrets.SN_SDK_OAUTH_CLIENT_SECRET }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          npx now-sdk cicd publish --app-version "$VERSION"
          echo "app-version=$VERSION" >> "$GITHUB_OUTPUT"

  # Promotion only -- installs the just-published version onto staging
  # from the Application Repository (never a direct install), then runs
  # the ATF suite there via the CI/CD API.
  install-staging:
    name: Install staging from Application Repository & run ATF gate
    needs: publish-to-app-repo
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Install from Application Repository
        env:
          SN_SDK_NODE_ENV: SN_SDK_CI_INSTALL
          SN_SDK_AUTH_TYPE: oauth
          SN_SDK_INSTANCE_URL: ${{ vars.SN_SDK_INSTANCE_URL }}
          SN_SDK_OAUTH_CLIENT_ID: ${{ secrets.SN_SDK_OAUTH_CLIENT_ID }}
          SN_SDK_OAUTH_CLIENT_SECRET: ${{ secrets.SN_SDK_OAUTH_CLIENT_SECRET }}
        run: npx now-sdk cicd install --app-version "${{ needs.publish-to-app-repo.outputs.app-version }}"

      - name: Run ATF gate suite
        env:
          SN_SDK_NODE_ENV: SN_SDK_CI_INSTALL
          SN_SDK_AUTH_TYPE: oauth
          SN_SDK_INSTANCE_URL: ${{ vars.SN_SDK_INSTANCE_URL }}
          SN_SDK_OAUTH_CLIENT_ID: ${{ secrets.SN_SDK_OAUTH_CLIENT_ID }}
          SN_SDK_OAUTH_CLIENT_SECRET: ${{ secrets.SN_SDK_OAUTH_CLIENT_SECRET }}
        run: npx now-sdk cicd testsuite run --test-suite-sys-id "${{ vars.ATF_TEST_SUITE_ID }}"

  gate:
    name: Required gate checks
    needs: [build, install-dev, publish-to-app-repo, install-staging]
    runs-on: ubuntu-latest
    if: always()
    steps:
      # publish-to-app-repo / install-staging are legitimately skipped on
      # a plain PR run (no promotion requested) -- only fail on an actual
      # failure/cancellation, not a skip.
      - name: Fail if any required job did not succeed
        run: |
          for result in "${{ needs.build.result }}" "${{ needs.install-dev.result }}" "${{ needs.publish-to-app-repo.result }}" "${{ needs.install-staging.result }}"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "A required gate check did not succeed (status: $result)."
              exit 1
            fi
          done
